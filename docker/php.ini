; Production PHP settings for the Render/FrankenPHP image.

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 21M
max_execution_time = 60
expose_php = Off

; OPcache — big throughput win for Laravel in production.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.preload_user = www-data

; Log to stderr so Render captures it in the live log stream.
log_errors = On
error_log = /dev/stderr
display_errors = Off
