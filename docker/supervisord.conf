[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; --------------------------------------------------------------------------
; Web server — FrankenPHP (classic mode). Binds to Render's $PORT via the
; Caddyfile. This is the critical process; if it dies the container exits.
; --------------------------------------------------------------------------
[program:frankenphp]
command=frankenphp run --config /etc/frankenphp/Caddyfile
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; --------------------------------------------------------------------------
; Queue worker — processes the database queue (jobs, activitylog, etc.).
; --queue=default; --max-time recycles the worker hourly to avoid leaks.
; --------------------------------------------------------------------------
[program:queue]
command=php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; --------------------------------------------------------------------------
; Scheduler — replaces the system cron. Runs due scheduled tasks every
; minute (e.g. spatie activitylog:clean once you register it).
; --------------------------------------------------------------------------
[program:scheduler]
command=php /app/artisan schedule:work
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
