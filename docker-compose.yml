# LOCAL DEVELOPMENT ONLY — not used by Render.
# Render deploys via render.yaml (Neon Postgres). This compose file runs the
# exact same production image against a throwaway local Postgres so you can
# validate the container locally with one command:
#
#     docker compose up --build
#
# Then open http://localhost:8080  (health: http://localhost:8080/up)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laboratory
      POSTGRES_USER: laboratory
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"          # exposed so you can inspect with a local client
    volumes:
      - lab-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laboratory -d laboratory"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: runs migrations + seeders, then exits. The app waits for it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: laboratory:render
    command: php artisan migrate --force --seed
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: laboratory:render          # reuse the image built by `migrate`
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env.docker
    ports:
      - "8080:8080"                   # host 8080 -> FrankenPHP in container
    restart: unless-stopped

volumes:
  lab-db-data:
