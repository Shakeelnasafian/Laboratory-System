# Local run of the production image against a throwaway Postgres.
#
#     docker compose up --build
#
# Then open http://localhost:8080  (health: http://localhost:8080/up)
#
# The app container installs nothing at start: deps and assets are baked into
# the image. On start it creates .env from image defaults, generates APP_KEY if
# you did not supply one, waits for the DB and runs migrations.
# Add demo data once with:  RUN_SEEDERS=true docker compose up

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laboratory
      POSTGRES_USER: laboratory
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - lab-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laboratory -d laboratory"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laboratory:latest
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.docker
    environment:
      RUN_SEEDERS: ${RUN_SEEDERS:-false}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  lab-db-data:
